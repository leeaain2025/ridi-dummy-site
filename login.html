<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 - 리디</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f8ce6'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' font-weight='900' fill='white' font-family='Arial'%3ER%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth">
  <a class="logo" href="index.html">RIDI</a>
  <form class="card" id="login-form" novalidate>
    <div class="alert err" id="login-alert" role="alert"></div>
    <div class="field">
      <label for="login-id" class="sr">아이디</label>
      <input id="login-id" name="username" type="text" placeholder="아이디" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="login-pw" class="sr">비밀번호</label>
      <div class="pw-wrap">
        <input id="login-pw" name="password" type="password" placeholder="비밀번호" autocomplete="current-password">
        <button type="button" class="eye" data-toggle="login-pw">표시</button>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="login-keep" name="keep" checked> 로그인 상태 유지</label>
    <button type="submit" class="btn blue" id="login-submit">로그인</button>
    <div class="auth-links">
      <a href="#">아이디 찾기</a><a href="#">비밀번호 재설정</a><a href="#">회원가입</a>
    </div>
  </form>
  <div class="demo-note">
    시연용 더미 사이트입니다. 데모 계정: 아이디 <code>ridi_demo</code> / 비밀번호 <code>Demo1234!</code><br>
    비밀번호를 변경하면 이 브라우저에 저장되며, 초기화하려면 <a href="#" id="reset-demo" style="color:var(--blue);font-weight:700">여기</a>를 누르세요.
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var ret = qs.get("return_url") || "mypage.html";
  if (!/^[\w-]+\.html$/.test(ret)) ret = "mypage.html";
  if (Auth.isLoggedIn()) { location.replace(ret); return; }

  var form = document.getElementById("login-form"), alertBox = document.getElementById("login-alert");
  var idEl = document.getElementById("login-id"), pwEl = document.getElementById("login-pw");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    alertBox.classList.remove("show");
    if (!idEl.value.trim()) { show("아이디를 입력해 주세요."); idEl.focus(); return; }
    if (!pwEl.value) { show("비밀번호를 입력해 주세요."); pwEl.focus(); return; }
    var btn = document.getElementById("login-submit"); btn.disabled = true; btn.textContent = "로그인 중...";
    setTimeout(function () {
      var r = Auth.login(idEl.value, pwEl.value, document.getElementById("login-keep").checked);
      if (r.ok) { location.href = ret; }
      else { btn.disabled = false; btn.textContent = "로그인"; show(r.msg); pwEl.value = ""; pwEl.focus(); }
    }, 350);
  });
  function show(m) { alertBox.textContent = m; alertBox.classList.add("show"); }

  document.querySelector("[data-toggle]").addEventListener("click", function () {
    var i = document.getElementById(this.dataset.toggle);
    i.type = i.type === "password" ? "text" : "password"; this.textContent = i.type === "password" ? "표시" : "숨김";
  });
  document.getElementById("reset-demo").addEventListener("click", function (e) {
    e.preventDefault(); Auth.reset(); RIDI.toast("데모 계정을 초기 상태로 되돌렸습니다.");
  });
  document.querySelectorAll(".auth-links a").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); RIDI.toast("데모 사이트에서는 지원하지 않는 기능입니다."); }); });
})();
</script>
</body>
</html>
