<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>비밀번호 변경 - 리디</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f8ce6'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' font-weight='900' fill='white' font-family='Arial'%3ER%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>
<main class="wrap">
  <h1 class="page-title">비밀번호 변경</h1>
  <div class="my">
    <aside class="side" id="side"></aside>
    <section>
      <div class="panel" id="pw-panel">
        <h3>새 비밀번호 설정 <small>안전을 위해 주기적으로 변경해 주세요</small></h3>
        <form class="form" id="pw-form" novalidate>
          <div class="alert err" id="pw-alert" role="alert"></div>
          <div class="field">
            <label for="cur-pw">현재 비밀번호</label>
            <div class="pw-wrap"><input id="cur-pw" name="current_password" type="password" autocomplete="current-password" placeholder="현재 비밀번호 입력"><button type="button" class="eye" data-toggle="cur-pw">표시</button></div>
            <div class="hint" id="cur-hint"></div>
          </div>
          <div class="field">
            <label for="new-pw">새 비밀번호</label>
            <div class="pw-wrap"><input id="new-pw" name="new_password" type="password" autocomplete="new-password" placeholder="새 비밀번호 입력"><button type="button" class="eye" data-toggle="new-pw">표시</button></div>
            <ul class="rules" id="rules">
              <li data-k="len">8자 이상 32자 이하</li>
              <li data-k="kinds">영문, 숫자, 특수문자 중 2가지 이상 조합</li>
              <li data-k="noSpace">공백 없이 입력</li>
              <li data-k="notId">아이디 미포함</li>
            </ul>
          </div>
          <div class="field">
            <label for="new-pw2">새 비밀번호 확인</label>
            <div class="pw-wrap"><input id="new-pw2" name="new_password_confirm" type="password" autocomplete="new-password" placeholder="새 비밀번호 다시 입력"><button type="button" class="eye" data-toggle="new-pw2">표시</button></div>
            <div class="hint" id="pw2-hint"></div>
          </div>
          <div class="form-actions">
            <a class="btn ghost sm" href="account.html">취소</a>
            <button type="submit" class="btn blue sm" id="pw-submit" disabled>비밀번호 변경</button>
          </div>
        </form>
      </div>
    </section>
  </div>
</main>
<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/mypage.js"></script>
<script>RIDI.renderMypage("password"); RIDI.initPasswordForm();</script>
</body>
</html>
